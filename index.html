<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSA Cram</title>
  <script>try{var v=JSON.parse(localStorage.getItem('dsa-cram-view'))||{};document.documentElement.dataset.theme=v.theme==='light'?'light':'dark';if(v.sepia)document.documentElement.dataset.sepia='';}catch(e){}</script>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%23e9b44c%22/%3E%3C/svg%3E">
</head>
<body>
  <div id="app"></div>
  <div id="board" class="board" hidden>
    <div class="board-bar">
      <span class="board-title">Typing board</span>
      <span class="board-count" id="boardCount"></span>
      <span class="board-help"><kbd>Enter</kbd> done (closes) · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · <kbd>Ctrl/⌘</kbd>+<kbd>B</kbd> fully hide card · <kbd>Esc</kbd> close</span>
    </div>
    <textarea id="boardInput" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Write it out from memory…"></textarea>
  </div>

  <script src="content/unit1.js"></script>
  <script src="content/unit2.js"></script>
  <script src="content/unit3.js"></script>
  <script src="content/unit4.js"></script>
  <script src="content/unit5.js"></script>
  <script src="diagrams.js"></script>
  <script src="content/diagrams-unit1.js"></script>
  <script src="content/diagrams-unit2.js"></script>
  <script src="content/diagrams-unit3.js"></script>
  <script src="content/diagrams-unit4.js"></script>
  <script src="content/diagrams-unit5.js"></script>
  <script src="app.js"></script>
</body>
</html>
